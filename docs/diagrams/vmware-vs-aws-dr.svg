<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="532" viewBox="0 0 920 532" role="img" aria-label="VMware vs AWS DR">
  <title>VMware vs AWS disaster recovery comparison</title>
  <defs>
    <marker id="v" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <text x="460" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">VMware vs AWS DR (Project 1)</text>

  <rect x="40" y="56" width="400" height="400" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="240" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">VMware ckad-lab · K8s 1.31.14</text>

  <rect x="120" y="108" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="240" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Git</text>
  <path d="M240 140 V158" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="120" y="158" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="240" y="179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Argo CD v3.5.3</text>
  <path d="M240 190 V208" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="120" y="208" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="240" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Kubernetes</text>
  <path d="M240 240 V258" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="120" y="258" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="240" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">local-path (storage-lab)</text>
  <path d="M240 290 V308" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="120" y="308" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="240" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">node-local disk</text>

  <text x="240" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Node failure: storage stays on failed worker</text>
  <text x="240" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Pod delete on same node: data OK (proven)</text>
  <text x="240" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Single control-plane node (no etcd backup in repo)</text>
  <text x="240" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Config recovery: Git + Argo (same model as AWS)</text>

  <rect x="480" y="56" width="400" height="400" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="680" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">AWS EKS platform-lab-aws · 1.36.4</text>

  <rect x="560" y="108" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="680" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Git</text>
  <path d="M680 140 V158" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="560" y="158" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="680" y="179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Argo CD v3.1.0</text>
  <path d="M680 190 V208" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="560" y="208" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="680" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">EKS (managed control plane HA)</text>
  <path d="M680 240 V258" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="560" y="258" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="680" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">EBS CSI · ebs-gp3</text>
  <path d="M680 290 V308" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="560" y="308" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="680" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">EBS (AZ-local)</text>
  <path d="M680 340 V358" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <rect x="560" y="358" width="240" height="32" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/><text x="680" y="379" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Snapshot / AWS Backup (TBD)</text>

  <text x="680" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Node failure same AZ: same EBS reattach (~6.3 min)</text>
  <text x="680" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Data loss: snapshot restore to dr-storage-restore (TBD)</text>
  <text x="680" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Infra rebuild: Terraform local state + Git</text>

  <rect x="40" y="472" width="840" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="494" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Shared recovery planes: Git (config) · Registry digest 0.1.4 · Runbooks</text>
  <text x="460" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Never destroy main EKS/VPC/platform-lab/storage-lab — use dr-lab and dr-storage-restore only</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="AppProject security boundary">
  <title>AppProject security boundary</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}
      .sec{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:8}
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#0f172a}
      .l{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#0f172a}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:11px;fill:#475569}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="360" y="28" text-anchor="middle" class="t">AppProject Security Boundary</text>
  <rect x="240" y="50" width="240" height="40" class="box"/>
  <text x="360" y="75" text-anchor="middle" class="l">User / Automation</text>
  <path class="line" d="M360 90 V120"/>
  <rect x="240" y="120" width="240" height="40" class="box"/>
  <text x="360" y="145" text-anchor="middle" class="l">RBAC (WHO)</text>
  <path class="line" d="M360 160 V190"/>
  <rect x="240" y="190" width="240" height="40" class="box"/>
  <text x="360" y="215" text-anchor="middle" class="l">Application</text>
  <path class="line" d="M360 230 V260"/>
  <rect x="200" y="260" width="320" height="50" class="sec"/>
  <text x="360" y="282" text-anchor="middle" class="l">AppProject (WHERE / WHAT / FROM)</text>
  <text x="360" y="300" text-anchor="middle" class="s">not just organizational metadata</text>
  <path class="line" d="M260 310 V340"/>
  <path class="line" d="M360 310 V340"/>
  <path class="line" d="M460 310 V340"/>
  <rect x="80" y="340" width="160" height="60" class="box"/>
  <text x="160" y="365" text-anchor="middle" class="l">Source repos</text>
  <text x="160" y="383" text-anchor="middle" class="s">allow-listed Git URLs</text>
  <rect x="280" y="340" width="160" height="60" class="box"/>
  <text x="360" y="365" text-anchor="middle" class="l">Destinations</text>
  <text x="360" y="383" text-anchor="middle" class="s">cluster + namespace</text>
  <rect x="480" y="340" width="160" height="60" class="box"/>
  <text x="560" y="365" text-anchor="middle" class="l">Resources</text>
  <text x="560" y="383" text-anchor="middle" class="s">allowed kinds</text>
  <path class="line" d="M360 400 V430"/>
  <rect x="240" y="430" width="240" height="36" class="box"/>
  <text x="360" y="453" text-anchor="middle" class="l">Kubernetes API</text>
</svg>

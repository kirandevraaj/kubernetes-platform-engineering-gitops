<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="AppProject security boundary">
  <title>AppProject security boundary</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">AppProject Security Boundary</text>
  <rect x="240" y="50" width="240" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="360" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">User / Automation</text>
  <path d="M360 90 V120" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="240" y="120" width="240" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="360" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">RBAC (WHO)</text>
  <path d="M360 160 V190" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="240" y="190" width="240" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="360" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Application</text>
  <path d="M360 230 V260" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="200" y="260" width="320" height="50" fill="#fff7ed" stroke="#c2410c" stroke-width="2" rx="8"/>
  <text x="360" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">AppProject (WHERE / WHAT / FROM)</text>
  <text x="360" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">not just organizational metadata</text>
  <path d="M360 310 V320" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M160 320 H560" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M160 320 V338" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M360 320 V338" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M560 320 V338" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="80" y="340" width="160" height="60" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="160" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Source repos</text>
  <text x="160" y="383" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">allow-listed Git URLs</text>
  <rect x="280" y="340" width="160" height="60" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="360" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Destinations</text>
  <text x="360" y="383" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">cluster + namespace</text>
  <rect x="480" y="340" width="160" height="60" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="560" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Resources</text>
  <text x="560" y="383" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">allowed kinds</text>
  <path d="M360 400 V430" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="240" y="430" width="240" height="36" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="360" y="453" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Kubernetes API</text>
</svg>

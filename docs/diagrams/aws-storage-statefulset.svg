<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-label="AWS EKS StatefulSet EBS storage architecture">
  <title>AWS EKS Persistent Storage  StatefulSet to EBS</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:8; }
      .aws { fill:#eff6ff; stroke:#1d4ed8; stroke-width:2; rx:8; }
      .ok { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:8; }
      .note { fill:#fefce8; stroke:#a16207; stroke-width:2; rx:8; }
      .title { font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:18px; font-weight:700; fill:#0f172a; }
      .label { font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; fill:#0f172a; }
      .sub { font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:12px; fill:#475569; }
      .line { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <text x="460" y="36" text-anchor="middle" class="title">AWS EKS Storage Lab  StatefulSet Persistence</text>

  <rect x="340" y="56" width="240" height="44" class="aws"/>
  <text x="460" y="84" text-anchor="middle" class="label">AWS EKS</text>
  <path class="line" d="M460 100 V120"/>

  <rect x="340" y="120" width="240" height="48" class="box"/>
  <text x="460" y="142" text-anchor="middle" class="label">StatefulSet</text>
  <text x="460" y="158" text-anchor="middle" class="sub">storage-demo · replicas=1</text>
  <path class="line" d="M460 168 V188"/>

  <rect x="340" y="188" width="240" height="48" class="box"/>
  <text x="460" y="210" text-anchor="middle" class="label">storage-demo-0</text>
  <text x="460" y="226" text-anchor="middle" class="sub">Pod mounts /data</text>
  <path class="line" d="M460 236 V256"/>

  <rect x="340" y="256" width="240" height="48" class="box"/>
  <text x="460" y="278" text-anchor="middle" class="label">PVC</text>
  <text x="460" y="294" text-anchor="middle" class="sub">data-storage-demo-0 · 1Gi RWO</text>
  <path class="line" d="M460 304 V324"/>

  <rect x="340" y="324" width="240" height="48" class="box"/>
  <text x="460" y="346" text-anchor="middle" class="label">PV</text>
  <text x="460" y="362" text-anchor="middle" class="sub">dynamically provisioned</text>
  <path class="line" d="M460 372 V392"/>

  <rect x="300" y="392" width="320" height="52" class="aws"/>
  <text x="460" y="414" text-anchor="middle" class="label">EBS CSI Driver</text>
  <text x="460" y="432" text-anchor="middle" class="sub">ebs.csi.aws.com · EKS add-on</text>
  <path class="line" d="M460 444 V464"/>

  <rect x="300" y="464" width="320" height="52" class="aws"/>
  <text x="460" y="486" text-anchor="middle" class="label">Pod Identity / IAM</text>
  <text x="460" y="504" text-anchor="middle" class="sub">ebs-csi-controller-sa ’ dedicated role</text>
  <path class="line" d="M460 516 V536"/>

  <rect x="300" y="536" width="320" height="52" class="aws"/>
  <text x="460" y="558" text-anchor="middle" class="label">Amazon EBS</text>
  <text x="460" y="576" text-anchor="middle" class="sub">gp3 volume · CSI-owned lifecycle</text>
  <path class="line" d="M460 588 V608"/>

  <rect x="300" y="608" width="320" height="48" class="box"/>
  <text x="460" y="630" text-anchor="middle" class="label">AWS Availability Zone</text>
  <text x="460" y="646" text-anchor="middle" class="sub">EBS is AZ-scoped</text>

  <rect x="40" y="680" width="400" height="88" class="note"/>
  <text x="60" y="708" class="label">Pod ’ PVC ’ PV is the Kubernetes abstraction</text>
  <text x="60" y="730" class="sub">StatefulSet volumeClaimTemplates create PVC</text>
  <text x="60" y="750" class="sub">StorageClass ebs-gp3 · WaitForFirstConsumer</text>

  <rect x="480" y="680" width="400" height="88" class="aws"/>
  <text x="500" y="708" class="label">EBS volume is the AWS storage implementation</text>
  <text x="500" y="730" class="sub">Not manually created or attached</text>
  <text x="500" y="750" class="sub">CSI driver owns create / attach / detach</text>

  <rect x="40" y="788" width="840" height="80" class="ok"/>
  <text x="60" y="818" class="label">PVC/PV survive Pod recreation</text>
  <text x="60" y="840" class="sub">Delete storage-demo-0 ’ StatefulSet recreates ordinal 0 ’ same PVC/PV/EBS ’ state.txt remains</text>
  <text x="60" y="858" class="sub">Node-failure / cross-AZ resilience is NOT claimed in this milestone</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-label="AWS EKS StatefulSet EBS storage architecture">
  <title>AWS EKS Persistent Storage — StatefulSet to EBS</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AWS EKS Storage Lab — StatefulSet Persistence</text>

  <rect x="340" y="56" width="240" height="44" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="460" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">AWS EKS</text>
  <path d="M460 100 V120" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="120" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">StatefulSet</text>
  <text x="460" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">storage-demo · replicas=1</text>
  <path d="M460 168 V188" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="188" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">storage-demo-0</text>
  <text x="460" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod mounts /data</text>
  <path d="M460 236 V256" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="256" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">PVC</text>
  <text x="460" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">data-storage-demo-0 · 1Gi RWO</text>
  <path d="M460 304 V324" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="324" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">PV</text>
  <text x="460" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">dynamically provisioned</text>
  <path d="M460 372 V392" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="392" width="320" height="52" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="460" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">EBS CSI Driver</text>
  <text x="460" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">ebs.csi.aws.com · EKS add-on</text>
  <path d="M460 444 V464" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="464" width="320" height="52" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="460" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Pod Identity / IAM</text>
  <text x="460" y="504" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">ebs-csi-controller-sa → dedicated role</text>
  <path d="M460 516 V536" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="536" width="320" height="52" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="460" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Amazon EBS</text>
  <text x="460" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">gp3 volume · CSI-owned lifecycle</text>
  <path d="M460 588 V608" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="608" width="320" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">AWS Availability Zone</text>
  <text x="460" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">EBS is AZ-scoped</text>

  <rect x="40" y="680" width="400" height="88" fill="#fefce8" stroke="#a16207" stroke-width="2" rx="8"/>
  <text x="60" y="708" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Pod → PVC → PV is the Kubernetes abstraction</text>
  <text x="60" y="730" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">StatefulSet volumeClaimTemplates create PVC</text>
  <text x="60" y="750" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">StorageClass ebs-gp3 · WaitForFirstConsumer</text>

  <rect x="480" y="680" width="400" height="88" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="500" y="708" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">EBS volume is the AWS storage implementation</text>
  <text x="500" y="730" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Not manually created or attached</text>
  <text x="500" y="750" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">CSI driver owns create / attach / detach</text>

  <rect x="40" y="788" width="840" height="80" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="60" y="818" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">PVC/PV survive Pod recreation</text>
  <text x="60" y="840" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Delete storage-demo-0 → StatefulSet recreates ordinal 0 → same PVC/PV/EBS → state.txt remains</text>
  <text x="60" y="858" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Node-failure / cross-AZ resilience is NOT claimed in this milestone</text>
</svg>

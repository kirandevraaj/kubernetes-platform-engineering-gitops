<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="App-of-Apps pattern">
  <title>App-of-Apps pattern</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">App-of-Apps Composition</text>
  <rect x="240" y="50" width="240" height="50" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="360" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Parent: platform-app-of-apps</text>
  <text x="360" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">manages Application manifests only</text>
  <path d="M360 100 V130" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M140 130 H580" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M140 130 V158" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M360 130 V158" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M580 130 V158" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="160" width="200" height="70" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="140" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">app-child-config</text>
  <text x="140" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">wave -1</text>
  <rect x="260" y="160" width="200" height="70" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="360" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">app-child-service</text>
  <text x="360" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">wave 0</text>
  <rect x="480" y="160" width="200" height="70" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="580" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">app-child-workload</text>
  <text x="580" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">wave 1</text>
  <path d="M140 230 V270" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M360 230 V270" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M580 230 V270" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="270" width="200" height="50" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="140" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">ConfigMap resources</text>
  <rect x="260" y="270" width="200" height="50" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="360" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Service resources</text>
  <rect x="480" y="270" width="200" height="50" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="580" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Deployment resources</text>
  <text x="360" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Composition pattern — security still comes from AppProject + RBAC</text>
  <text x="360" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Avoid recursion: child must never manage the parent</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="AWS IAM vs Kubernetes RBAC">
  <title>AWS IAM vs Kubernetes RBAC</title>
  <text x="460" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AWS IAM vs Kubernetes RBAC</text>
  <rect x="40" y="60" width="400" height="160" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="240" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Kubernetes API</text>
  <text x="240" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">↑</text>
  <text x="240" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Kubernetes RBAC</text>
  <text x="240" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">who may call the kube-apiserver</text>
  <rect x="480" y="60" width="400" height="160" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="680" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">AWS APIs</text>
  <text x="680" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">↑</text>
  <text x="680" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">AWS IAM</text>
  <text x="680" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">who may call EC2 / EBS / ELB / …</text>
  <rect x="140" y="250" width="640" height="140" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="460" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Bridge example (EBS CSI — unchanged in this lab)</text>
  <text x="460" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod → ServiceAccount → EKS Pod Identity → IAM Role → AWS API</text>
  <text x="460" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Kubernetes RBAC does not grant AWS permissions; IAM does not grant kubectl verbs</text>
  <text x="460" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Argo CD uses Kubernetes identity; Jenkins uses external CI credentials</text>
</svg>

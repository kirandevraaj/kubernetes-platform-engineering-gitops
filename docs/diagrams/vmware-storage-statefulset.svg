<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" role="img" aria-label="VMware StatefulSet storage architecture">
  <title>VMware Persistent Storage — StatefulSet to local-path</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">VMware Storage Lab — StatefulSet Persistence</text>

  <rect x="340" y="56" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">User / Operator</text>
  <text x="460" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">kubectl / Argo CD GitOps</text>
  <path d="M460 104 V128" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="128" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">StatefulSet</text>
  <text x="460" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">storage-demo · replicas=1</text>
  <path d="M460 176 V200" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="200" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Pod-0</text>
  <text x="460" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">storage-demo-0</text>
  <path d="M460 248 V272" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="272" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">PVC</text>
  <text x="460" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">data-storage-demo-0 · 1Gi RWO</text>
  <path d="M460 320 V344" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="344" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">PV</text>
  <text x="460" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">dynamically provisioned</text>
  <path d="M460 392 V416" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="340" y="416" width="240" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">StorageClass</text>
  <text x="460" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">local-path · WaitForFirstConsumer</text>
  <path d="M460 464 V488" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="488" width="320" height="56" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">VMware local-path storage</text>
  <text x="460" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">rancher.io/local-path · /opt/local-path-provisioner</text>
  <path d="M460 544 V568" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="568" width="320" height="56" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Worker node filesystem</text>
  <text x="460" y="610" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">hostPath on the scheduled worker</text>

  <rect x="40" y="656" width="400" height="96" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="60" y="684" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Data survives Pod recreation</text>
  <text x="60" y="706" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Delete Pod-0 → StatefulSet recreates Pod-0</text>
  <text x="60" y="726" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Same PVC → same PV → state.txt remains</text>

  <rect x="480" y="656" width="400" height="96" fill="#fff7ed" stroke="#c2410c" stroke-width="2" rx="8"/>
  <text x="500" y="684" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9a3412">LOCAL-PATH STORAGE IS NODE-LOCAL</text>
  <text x="500" y="706" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">PV has required nodeAffinity (hostname)</text>
  <text x="500" y="726" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Node loss ≠ automatic data mobility</text>
</svg>

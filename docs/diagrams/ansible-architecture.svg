<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-label="Ansible architecture">
  <title>Ansible architecture</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}
      .ctl{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:8}
      .mod{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:8}
      .node{fill:#fefce8;stroke:#a16207;stroke-width:2;rx:8}
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#0f172a}
      .l{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#0f172a}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:11px;fill:#475569}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="210" y="28" text-anchor="middle" class="t">Ansible Architecture</text>
  <rect x="110" y="48" width="200" height="44" class="ctl"/><text x="210" y="75" text-anchor="middle" class="l">Control Node</text>
  <path class="line" d="M210 92 V114"/>
  <rect x="110" y="114" width="200" height="44" class="box"/><text x="210" y="133" text-anchor="middle" class="l">Inventory</text><text x="210" y="149" text-anchor="middle" class="s">hosts.yml · aws_ec2</text>
  <path class="line" d="M210 158 V180"/>
  <rect x="110" y="180" width="200" height="44" class="box"/><text x="210" y="199" text-anchor="middle" class="l">Playbook</text><text x="210" y="215" text-anchor="middle" class="s">roles · vars · handlers</text>
  <path class="line" d="M210 224 V246"/>
  <rect x="110" y="246" width="200" height="44" class="mod"/><text x="210" y="265" text-anchor="middle" class="l">Modules (FQCN)</text><text x="210" y="281" text-anchor="middle" class="s">collections pinned</text>
  <path class="line" d="M210 290 V320"/>
  <path class="line" d="M80 350 V320 H340 V350"/>
  <rect x="30" y="350" width="110" height="50" class="node"/><text x="85" y="372" text-anchor="middle" class="l">localhost</text><text x="85" y="388" text-anchor="middle" class="s">lab mutate</text>
  <rect x="155" y="350" width="110" height="50" class="node"/><text x="210" y="372" text-anchor="middle" class="l">VMware</text><text x="210" y="388" text-anchor="middle" class="s">read-only</text>
  <rect x="280" y="350" width="110" height="50" class="node"/><text x="335" y="372" text-anchor="middle" class="l">AWS hosts</text><text x="335" y="388" text-anchor="middle" class="s">by tags</text>
  <text x="210" y="440" text-anchor="middle" class="s">Managed Nodes</text>
  <text x="210" y="480" text-anchor="middle" class="s">Check / diff before apply · Vault for secrets</text>
  <text x="210" y="520" text-anchor="middle" class="s">Project 1 · ansible-core 2.18.6</text>
</svg>

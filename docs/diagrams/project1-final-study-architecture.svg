<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-label="Project 1 final study architecture">
  <title>Project 1 final study architecture - control, data, management, automation, observability</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1120" height="780" fill="#f7f8fa"/>
  <text x="560" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="18" font-weight="700">Project 1 - final study architecture (conceptual)</text>
  <text x="560" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="11">Five flows that never mix: CI builds artifacts, CD reconciles Git, users hit the data plane, Terraform manages AWS, automation calls APIs.</text>

  <!-- Lane 1: CI -->
  <rect x="20" y="66" width="1080" height="96" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
  <rect x="20" y="66" width="180" height="96" rx="8" fill="#e8f1ff" stroke="#3b6ea5"/>
  <text x="110" y="104" text-anchor="middle" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">CONTROL: CI</text>
  <text x="110" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">builds artifacts,</text>
  <text x="110" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">never deploys</text>
  <rect x="220" y="92" width="150" height="44" rx="5" fill="#e8f1ff" stroke="#3b6ea5"/><text x="295" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Developer</text><text x="295" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">commit to app/</text>
  <rect x="400" y="92" width="150" height="44" rx="5" fill="#e8f1ff" stroke="#3b6ea5"/><text x="475" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">GitHub (main)</text><text x="475" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">source + desired state</text>
  <rect x="580" y="92" width="150" height="44" rx="5" fill="#e8f1ff" stroke="#3b6ea5"/><text x="655" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Jenkins</text><text x="655" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">test, build, push</text>
  <rect x="760" y="92" width="150" height="44" rx="5" fill="#fff4e0" stroke="#a57a3b"/><text x="835" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Docker Hub</text><text x="835" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">image tag + sha256 digest</text>
  <rect x="940" y="92" width="150" height="44" rx="5" fill="#f0e8ff" stroke="#6b3ba5"/><text x="1015" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Overlay commit</text><text x="1015" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">digest pinned in Git</text>
  <path d="M370 114 H398" stroke="#333" marker-end="url(#arr)"/>
  <path d="M550 114 H578" stroke="#333" marker-end="url(#arr)"/>
  <path d="M730 114 H758" stroke="#333" marker-end="url(#arr)"/>
  <path d="M910 114 H938" stroke="#333" marker-end="url(#arr)"/>
  <text x="560" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10" font-style="italic">Jenkins pushes the promotion commit back to GitHub; overlay-only commits skip app CI (loop prevention).</text>

  <!-- Lane 2: CD -->
  <rect x="20" y="176" width="1080" height="96" rx="8" fill="#ffffff" stroke="#6b3ba5"/>
  <rect x="20" y="176" width="180" height="96" rx="8" fill="#f0e8ff" stroke="#6b3ba5"/>
  <text x="110" y="214" text-anchor="middle" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">CONTROL: CD</text>
  <text x="110" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">GitOps reconciliation</text>
  <text x="110" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">(pull, not push)</text>
  <rect x="220" y="202" width="150" height="44" rx="5" fill="#f0e8ff" stroke="#6b3ba5"/><text x="295" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Git overlays</text><text x="295" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">kubernetes/overlays/*</text>
  <rect x="400" y="202" width="150" height="44" rx="5" fill="#f0e8ff" stroke="#6b3ba5"/><text x="475" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Argo CD</text><text x="475" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">one instance per cluster</text>
  <rect x="580" y="202" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="655" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Kubernetes API</text><text x="655" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">ckad-lab | EKS</text>
  <rect x="760" y="202" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="835" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Live objects</text><text x="835" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">Deployment, Service, HPA</text>
  <rect x="940" y="202" width="150" height="44" rx="5" fill="#fff8e1" stroke="#a58a3b"/><text x="1015" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">AppProject</text><text x="1015" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">allowed repos/destinations</text>
  <path d="M370 224 H398" stroke="#333" marker-end="url(#arr)"/>
  <path d="M550 224 H578" stroke="#333" marker-end="url(#arr)"/>
  <path d="M730 224 H758" stroke="#333" marker-end="url(#arr)"/>
  <path d="M940 224 H912" stroke="#999" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="560" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10" font-style="italic">VMware Argo CD v3.5.3 and AWS Argo CD v3.1.0 were separate control planes; selfHeal reverts live drift.</text>

  <!-- Lane 3: Data plane -->
  <rect x="20" y="286" width="1080" height="96" rx="8" fill="#ffffff" stroke="#ad1457"/>
  <rect x="20" y="286" width="180" height="96" rx="8" fill="#fce4ec" stroke="#ad1457"/>
  <text x="110" y="324" text-anchor="middle" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">DATA PLANE</text>
  <text x="110" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">user HTTP traffic</text>
  <text x="110" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">only</text>
  <rect x="220" y="312" width="150" height="44" rx="5" fill="#fce4ec" stroke="#ad1457"/><text x="295" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Client</text><text x="295" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">HTTP</text>
  <rect x="400" y="312" width="150" height="44" rx="5" fill="#e0f7fa" stroke="#00796b"/><text x="475" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">VIP / ALB</text><text x="475" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">MetalLB .200 | AWS ALB</text>
  <rect x="580" y="312" width="150" height="44" rx="5" fill="#e0f7fa" stroke="#00796b"/><text x="655" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">ingress-nginx</text><text x="655" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">VMware only, 2 replicas</text>
  <rect x="760" y="312" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="835" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Service</text><text x="835" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">ClusterIP :8000</text>
  <rect x="940" y="312" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="1015" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Pod :8000</text><text x="1015" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">FastAPI 0.1.4 digest</text>
  <path d="M370 334 H398" stroke="#ad1457" marker-end="url(#arr)"/>
  <path d="M550 334 H578" stroke="#ad1457" marker-end="url(#arr)"/>
  <path d="M730 334 H758" stroke="#ad1457" marker-end="url(#arr)"/>
  <path d="M910 334 H938" stroke="#ad1457" marker-end="url(#arr)"/>
  <text x="560" y="374" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10" font-style="italic">AWS path skips ingress-nginx: ALB (target-type ip) sends traffic straight to pod IPs. Terraform and Argo CD are never HTTP hops.</text>

  <!-- Lane 4: Management -->
  <rect x="20" y="396" width="1080" height="96" rx="8" fill="#ffffff" stroke="#e65100"/>
  <rect x="20" y="396" width="180" height="96" rx="8" fill="#fff0e0" stroke="#e65100"/>
  <text x="110" y="434" text-anchor="middle" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">MANAGEMENT: IaC</text>
  <text x="110" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">AWS infrastructure</text>
  <text x="110" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">lifecycle</text>
  <rect x="220" y="422" width="150" height="44" rx="5" fill="#fff0e0" stroke="#e65100"/><text x="295" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Terraform</text><text x="295" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">terraform/aws (local state)</text>
  <rect x="400" y="422" width="150" height="44" rx="5" fill="#fff0e0" stroke="#e65100"/><text x="475" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">VPC</text><text x="475" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">10.50.0.0/16, 2 AZs, 1 NAT</text>
  <rect x="580" y="422" width="150" height="44" rx="5" fill="#fff0e0" stroke="#e65100"/><text x="655" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">EKS + node group</text><text x="655" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">1.36, 2 x t3.medium</text>
  <rect x="760" y="422" width="150" height="44" rx="5" fill="#fff0e0" stroke="#e65100"/><text x="835" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">IAM</text><text x="835" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">roles, Pod Identity</text>
  <rect x="940" y="422" width="150" height="44" rx="5" fill="#fff0e0" stroke="#e65100"/><text x="1015" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Add-ons</text><text x="1015" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">LBC, EBS CSI, snapshots</text>
  <path d="M370 444 H398" stroke="#333" marker-end="url(#arr)"/>
  <path d="M550 444 H578" stroke="#333" marker-end="url(#arr)"/>
  <path d="M730 444 H758" stroke="#333" marker-end="url(#arr)"/>
  <path d="M910 444 H938" stroke="#333" marker-end="url(#arr)"/>
  <text x="560" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10" font-style="italic">Terraform also bootstrapped AWS Argo CD. It does not describe the VMware VMs. AWS runtime destroyed 2026-09-26; source kept.</text>

  <!-- Lane 5: Automation -->
  <rect x="20" y="506" width="1080" height="96" rx="8" fill="#ffffff" stroke="#00796b"/>
  <rect x="20" y="506" width="180" height="96" rx="8" fill="#e0f7fa" stroke="#00796b"/>
  <text x="110" y="544" text-anchor="middle" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">AUTOMATION</text>
  <text x="110" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">custom logic and</text>
  <text x="110" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">host configuration</text>
  <rect x="220" y="532" width="150" height="44" rx="5" fill="#e0f7fa" stroke="#00796b"/><text x="295" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Python CLI</text><text x="295" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">platform-automate</text>
  <rect x="400" y="532" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="475" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">APIs</text><text x="475" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">Kubernetes, AWS (Boto3)</text>
  <rect x="760" y="532" width="150" height="44" rx="5" fill="#e0f7fa" stroke="#00796b"/><text x="835" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Ansible</text><text x="835" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">playbooks + roles</text>
  <rect x="940" y="532" width="150" height="44" rx="5" fill="#eceff1" stroke="#455a64"/><text x="1015" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Systems</text><text x="1015" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">Linux, Jenkins agent</text>
  <rect x="580" y="532" width="150" height="44" rx="5" fill="#fff8e1" stroke="#a58a3b"/><text x="655" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Guard rails</text><text x="655" y="566" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">--dry-run, --confirm</text>
  <path d="M370 554 H398" stroke="#333" marker-end="url(#arr)"/>
  <path d="M910 554 H938" stroke="#333" marker-end="url(#arr)"/>
  <text x="560" y="594" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10" font-style="italic">ops commands are read-only; only automation-lab may be mutated. Ansible ran on Linux/Jenkins (Windows CLI blocked).</text>

  <!-- Lane 6: Observability -->
  <rect x="20" y="616" width="1080" height="96" rx="8" fill="#ffffff" stroke="#3ba55a"/>
  <rect x="20" y="616" width="180" height="96" rx="8" fill="#e8ffe8" stroke="#3ba55a"/>
  <text x="110" y="654" text-anchor="middle" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">OBSERVABILITY</text>
  <text x="110" y="672" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">two separate</text>
  <text x="110" y="685" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10">metric paths</text>
  <rect x="220" y="642" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="295" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">/metrics + KSM</text><text x="295" y="676" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">+ node-exporter</text>
  <rect x="400" y="642" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="475" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Prometheus</text><text x="475" y="676" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">scrape every 30s</text>
  <rect x="580" y="642" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="655" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Grafana</text><text x="655" y="676" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">dashboards (humans)</text>
  <rect x="760" y="642" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="835" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">Metrics Server</text><text x="835" y="676" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">kubelet resource metrics</text>
  <rect x="940" y="642" width="150" height="44" rx="5" fill="#e8ffe8" stroke="#3ba55a"/><text x="1015" y="662" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#222" font-size="12" font-weight="700">HPA / kubectl top</text><text x="1015" y="676" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#444" font-size="10">machines + operators</text>
  <path d="M370 664 H398" stroke="#333" marker-end="url(#arr)"/>
  <path d="M550 664 H578" stroke="#333" marker-end="url(#arr)"/>
  <path d="M910 664 H938" stroke="#333" marker-end="url(#arr)"/>
  <text x="560" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="10" font-style="italic">Fixing Prometheus does not fix HPA. Metrics Server is still running on the current VMware base lab; Prometheus/Grafana were removed.</text>

  <text x="560" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="11">Historical architecture (VMware full platform + AWS EKS). Current runtime: VMware basic kubeadm lab only. See docs/portfolio/project1-environment-map.md.</text>
  <text x="560" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#555" font-size="11">Sources: architecture/project1-reference-architecture.md, architecture/tool-boundaries.md, ADR 001-013.</text>
</svg>

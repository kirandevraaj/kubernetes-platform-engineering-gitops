<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-label="EBS snapshot recovery">
  <title>EBS snapshot recovery flow</title>
  <defs>
    <marker id="e" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <text x="440" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">EBS Snapshot Recovery (live vs restored copy)</text>

  <text x="220" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Live path (storage-lab)</text>
  <rect x="40" y="72" width="360" height="40" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="220" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Live EBS vol-05faa26874d720ecd</text>
  <path d="M220 112 V132" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#e)"/>
  <rect x="80" y="132" width="280" height="36" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="220" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Point-in-time snapshot (VolumeSnapshot)</text>
  <path d="M220 168 V188" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#e)"/>
  <rect x="100" y="188" width="240" height="32" fill="#fefce8" stroke="#a16207" stroke-width="2" rx="8"/>
  <text x="220" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Snapshot handle (AWS)</text>

  <text x="660" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Restore path (dr-storage-restore)</text>
  <path d="M340 204 H660 V238" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#e)"/>
  <rect x="540" y="240" width="240" height="36" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="660" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">New EBS volume (new ID)</text>
  <path d="M660 276 V296" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#e)"/>
  <rect x="540" y="296" width="240" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="660" y="317" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">PVC restored-storage</text>
  <path d="M660 328 V348" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#e)"/>
  <rect x="540" y="348" width="240" height="32" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="660" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">PV (dynamic bind)</text>
  <path d="M660 380 V400" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#e)"/>
  <rect x="540" y="400" width="240" height="36" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="660" y="423" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Pod storage-restore-demo</text>
  <path d="M660 436 V456" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#e)"/>
  <rect x="520" y="456" width="280" height="36" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="660" y="479" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Data verification (state.txt)</text>

  <rect x="40" y="240" width="360" height="120" fill="#f8fafc" stroke="#64748b" stroke-width="1" rx="6"/>
  <text x="220" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Snapshot point in time</text>
  <text x="60" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">+ data before snapshot = recoverable in restore copy</text>
  <text x="60" y="312" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">+ data after snapshot (e.g. SNAPSHOT-POINT-B) = NOT in restore</text>
  <text x="60" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Live volume keeps A + B; restore copy should show A only</text>

  <rect x="40" y="400" width="360" height="92" fill="#f8fafc" stroke="#64748b" stroke-width="1" rx="6"/>
  <text x="220" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Same-volume recovery (no snapshot)</text>
  <text x="60" y="448" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Pod delete / same-AZ node loss: same PVC, PV, EBS</text>
  <text x="60" y="468" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Tested: ~14s pod delete; ~6.3 min node failure</text>
  <text x="60" y="488" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Snapshot drill: documented only until Phase 19-27</text>

  <text x="440" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Do not delete original vol-05faa26874d720ecd or data-storage-demo-0</text>
</svg>

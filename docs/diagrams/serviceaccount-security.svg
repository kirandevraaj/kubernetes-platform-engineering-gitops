<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="ServiceAccount token security">
  <title>ServiceAccount token exposure</title>
  <text x="460" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ServiceAccount Token Exposure</text>
  <rect x="40" y="70" width="400" height="240" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="240" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Default / automount=true</text>
  <text x="240" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod → ServiceAccount → RBAC</text>
  <text x="240" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">→ Kubernetes API (if authorized)</text>
  <text x="240" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Projected at:</text>
  <text x="240" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">/var/run/secrets/kubernetes.io/serviceaccount</text>
  <text x="240" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">token · ca.crt · namespace</text>
  <rect x="480" y="70" width="400" height="240" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="680" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">automountServiceAccountToken=false</text>
  <text x="680" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod still has a ServiceAccount identity</text>
  <text x="680" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">for the API server / admission</text>
  <text x="680" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">No automatically mounted</text>
  <text x="680" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Kubernetes API token in the container</text>
  <text x="680" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Observed: path absent in security-no-api</text>
</svg>

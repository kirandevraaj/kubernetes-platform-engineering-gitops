<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-label="ServiceAccount token security">
  <title>ServiceAccount token exposure</title>
  <defs>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}
      .ok{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:8}
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#0f172a}
      .l{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#0f172a}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;fill:#475569}
    </style>
  </defs>
  <text x="460" y="34" text-anchor="middle" class="t">ServiceAccount Token Exposure</text>
  <rect x="40" y="70" width="400" height="240" class="box"/>
  <text x="240" y="110" text-anchor="middle" class="l">Default / automount=true</text>
  <text x="240" y="150" text-anchor="middle" class="s">Pod ’ ServiceAccount ’ RBAC</text>
  <text x="240" y="175" text-anchor="middle" class="s">’ Kubernetes API (if authorized)</text>
  <text x="240" y="215" text-anchor="middle" class="s">Projected at:</text>
  <text x="240" y="240" text-anchor="middle" class="s">/var/run/secrets/kubernetes.io/serviceaccount</text>
  <text x="240" y="275" text-anchor="middle" class="s">token · ca.crt · namespace</text>
  <rect x="480" y="70" width="400" height="240" class="ok"/>
  <text x="680" y="110" text-anchor="middle" class="l">automountServiceAccountToken=false</text>
  <text x="680" y="150" text-anchor="middle" class="s">Pod still has a ServiceAccount identity</text>
  <text x="680" y="175" text-anchor="middle" class="s">for the API server / admission</text>
  <text x="680" y="215" text-anchor="middle" class="s">No automatically mounted</text>
  <text x="680" y="240" text-anchor="middle" class="s">Kubernetes API token in the container</text>
  <text x="680" y="275" text-anchor="middle" class="s">Observed: path absent in security-no-api</text>
</svg>

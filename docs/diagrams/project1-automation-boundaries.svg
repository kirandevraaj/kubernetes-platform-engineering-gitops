<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Automation boundaries">
  <title>Project 1 Automation Boundaries</title>
  <rect width="900" height="560" fill="#f7f8fa"/>
  <text x="450" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Automation boundaries (not interchangeable)</text>

  <rect x="50" y="50" width="800" height="460" rx="10" fill="#ffffff" stroke="#334155"/>

  <rect x="80" y="80" width="160" height="56" rx="6" fill="#efebe9" stroke="#5d4037"/>
  <text x="160" y="102" text-anchor="middle" font-weight="700" font-size="12" font-family="Segoe UI">Terraform</text>
  <text x="160" y="120" text-anchor="middle" font-size="10" font-family="Segoe UI">AWS infra lifecycle</text>

  <rect x="280" y="80" width="160" height="56" rx="6" fill="#e8f1ff" stroke="#3b6ea5"/>
  <text x="360" y="102" text-anchor="middle" font-weight="700" font-size="12" font-family="Segoe UI">Jenkins</text>
  <text x="360" y="120" text-anchor="middle" font-size="10" font-family="Segoe UI">CI / build / promote</text>

  <rect x="480" y="80" width="160" height="56" rx="6" fill="#f0e8ff" stroke="#6b3ba5"/>
  <text x="560" y="102" text-anchor="middle" font-weight="700" font-size="12" font-family="Segoe UI">Git</text>
  <text x="560" y="120" text-anchor="middle" font-size="10" font-family="Segoe UI">desired state SoT</text>

  <rect x="680" y="80" width="160" height="56" rx="6" fill="#f0e8ff" stroke="#6b3ba5"/>
  <text x="760" y="102" text-anchor="middle" font-weight="700" font-size="12" font-family="Segoe UI">Argo CD</text>
  <text x="760" y="120" text-anchor="middle" font-size="10" font-family="Segoe UI">GitOps reconcile</text>

  <rect x="80" y="180" width="160" height="56" rx="6" fill="#efebe9" stroke="#5d4037"/>
  <text x="160" y="202" text-anchor="middle" font-weight="700" font-size="12" font-family="Segoe UI">Python</text>
  <text x="160" y="220" text-anchor="middle" font-size="10" font-family="Segoe UI">orchestration / doctor</text>

  <rect x="280" y="180" width="160" height="56" rx="6" fill="#efebe9" stroke="#5d4037"/>
  <text x="360" y="202" text-anchor="middle" font-weight="700" font-size="12" font-family="Segoe UI">Boto3</text>
  <text x="360" y="220" text-anchor="middle" font-size="10" font-family="Segoe UI">AWS API</text>

  <rect x="480" y="180" width="160" height="56" rx="6" fill="#efebe9" stroke="#5d4037"/>
  <text x="560" y="202" text-anchor="middle" font-weight="700" font-size="12" font-family="Segoe UI">K8s Python client</text>
  <text x="560" y="220" text-anchor="middle" font-size="10" font-family="Segoe UI">Kubernetes API</text>

  <rect x="680" y="180" width="160" height="56" rx="6" fill="#efebe9" stroke="#5d4037"/>
  <text x="760" y="202" text-anchor="middle" font-weight="700" font-size="12" font-family="Segoe UI">Ansible</text>
  <text x="760" y="220" text-anchor="middle" font-size="10" font-family="Segoe UI">config / ops modules</text>

  <text x="450" y="280" text-anchor="middle" font-size="12" font-weight="700" font-family="Segoe UI">Anti-patterns (avoid)</text>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#a53b3b" font-family="Segoe UI">Jenkins kubectl apply · Python patch Deployment tags · Ansible replace Terraform VPC</text>

  <rect x="120" y="330" width="660" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="450" y="355" text-anchor="middle" font-size="12" font-weight="700" font-family="Segoe UI">Typical happy path</text>
  <text x="450" y="380" text-anchor="middle" font-size="11" font-family="Segoe UI">Terraform (AWS) || Git + Jenkins → digest → Git overlays → Argo → cluster</text>
  <text x="450" y="405" text-anchor="middle" font-size="11" font-family="Segoe UI">Python/Ansible: read-mostly verify, bounded approved changes, runbook support</text>
  <text x="450" y="440" text-anchor="middle" font-size="10" fill="#555" font-family="Segoe UI">Observed: Ansible CLI blocked on Windows PATH · boto3/terraform PATH gaps documented</text>

  <text x="450" y="535" text-anchor="middle" font-size="10" fill="#555" font-family="Segoe UI">See docs/architecture/tool-boundaries.md · ADR 010</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-label="ApplicationSet generation">
  <title>ApplicationSet generation</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <rect width="820" height="500" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">ApplicationSet Generation</text>

  <!-- ApplicationSet boundary: generator -> parameters -> template -->
  <rect x="30" y="48" width="760" height="124" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" rx="10"/>
  <text x="46" y="68" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">ApplicationSet</text>
  <rect x="60" y="84" width="200" height="66" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="160" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Generator</text>
  <text x="160" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">list / git / cluster</text>
  <path d="M260 117 H308" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="310" y="84" width="200" height="66" fill="#ffffff" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="410" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Parameters</text>
  <text x="410" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">env, path, cluster…</text>
  <path d="M510 117 H558" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="560" y="84" width="200" height="66" fill="#ffffff" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="660" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Template</text>
  <text x="660" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">goTemplate + options</text>

  <!-- Template renders Applications -->
  <path d="M660 150 V186 H410 V198" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="190" y="200" width="440" height="46" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="410" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Generated Applications (owned by ApplicationSet)</text>

  <!-- Fan-out: one Application per generator element -->
  <path d="M410 246 V266" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M165 266 H655" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M165 266 V288" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M410 266 V288" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M655 266 V288" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="70" y="290" width="190" height="52" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="165" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">dev App</text>
  <text x="165" y="331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">env=dev</text>
  <rect x="315" y="290" width="190" height="52" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="410" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">test App</text>
  <text x="410" y="331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">env=test</text>
  <rect x="560" y="290" width="190" height="52" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="655" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">stage App</text>
  <text x="655" y="331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">env=stage</text>

  <!-- Each Application reconciles its own resources -->
  <path d="M165 342 V370" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M410 342 V370" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M655 342 V370" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="70" y="372" width="190" height="52" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="165" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Kubernetes resources</text>
  <text x="165" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">synced by Argo CD</text>
  <rect x="315" y="372" width="190" height="52" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="410" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Kubernetes resources</text>
  <text x="410" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">synced by Argo CD</text>
  <rect x="560" y="372" width="190" height="52" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="655" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Kubernetes resources</text>
  <text x="655" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">synced by Argo CD</text>

  <text x="410" y="466" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Each generator element fills the template once, producing one Application per environment.</text>
</svg>

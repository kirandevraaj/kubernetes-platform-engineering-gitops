<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Control and data plane">
  <title>Project 1 Control and Data Plane</title>
  <rect width="920" height="520" fill="#f7f8fa"/>
  <text x="460" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Control plane vs data plane</text>

  <!-- Control -->
  <rect x="40" y="50" width="400" height="200" rx="8" fill="#ffffff" stroke="#6b3ba5" stroke-width="2"/>
  <text x="240" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#6b3ba5">CONTROL / MANAGEMENT</text>
  <text x="240" y="95" text-anchor="middle" font-size="10" fill="#555" font-family="Segoe UI">Not user HTTP traffic</text>
  <rect x="170" y="110" width="140" height="32" rx="4" fill="#f0e8ff" stroke="#6b3ba5"/><text x="240" y="130" text-anchor="middle" font-size="11" font-family="Segoe UI">Developer</text>
  <path d="M240 142 V158" stroke="#333"/>
  <rect x="170" y="158" width="140" height="32" rx="4" fill="#f0e8ff" stroke="#6b3ba5"/><text x="240" y="178" text-anchor="middle" font-size="11" font-family="Segoe UI">GitHub</text>
  <path d="M120 190 H360" stroke="#333"/><path d="M120 190 V210" stroke="#333"/><path d="M360 190 V210" stroke="#333"/>
  <rect x="60" y="210" width="120" height="32" rx="4" fill="#e8f1ff" stroke="#3b6ea5"/><text x="120" y="230" text-anchor="middle" font-size="10" font-family="Segoe UI">Jenkins</text>
  <rect x="300" y="210" width="120" height="32" rx="4" fill="#fff4e0" stroke="#a57a3b"/><text x="360" y="230" text-anchor="middle" font-size="10" font-family="Segoe UI">Docker Hub</text>
  <rect x="170" y="250" width="140" height="32" rx="4" fill="#f0e8ff" stroke="#6b3ba5"/><text x="240" y="270" text-anchor="middle" font-size="11" font-family="Segoe UI">Argo CD</text>
  <path d="M240 282 V300" stroke="#333"/>
  <rect x="150" y="300" width="180" height="32" rx="4" fill="#e8ffe8" stroke="#3ba55a"/><text x="240" y="320" text-anchor="middle" font-size="10" font-family="Segoe UI">Kubernetes API ? desired state</text>

  <!-- Data VMware -->
  <rect x="480" y="50" width="400" height="200" rx="8" fill="#ffffff" stroke="#ad1457" stroke-width="2"/>
  <text x="680" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ad1457">DATA PLANE — VMware</text>
  <rect x="500" y="95" width="80" height="28" rx="4" fill="#fce4ec" stroke="#ad1457"/><text x="540" y="113" text-anchor="middle" font-size="10" font-family="Segoe UI">Client</text>
  <text x="600" y="113" font-size="14" fill="#ad1457">?</text>
  <rect x="610" y="95" width="100" height="28" rx="4" fill="#e0f7fa" stroke="#00796b"/><text x="660" y="113" text-anchor="middle" font-size="9" font-family="Segoe UI">MetalLB VIP</text>
  <text x="720" y="113" font-size="14" fill="#ad1457">?</text>
  <rect x="730" y="95" width="120" height="28" rx="4" fill="#e0f7fa" stroke="#00796b"/><text x="790" y="113" text-anchor="middle" font-size="9" font-family="Segoe UI">ingress-nginx</text>
  <path d="M680 123 V145" stroke="#ad1457"/>
  <rect x="580" y="145" width="200" height="28" rx="4" fill="#ffe8e8" stroke="#a53b3b"/><text x="680" y="163" text-anchor="middle" font-size="10" font-family="Segoe UI">Service ? Pod :8000</text>
  <text x="680" y="195" text-anchor="middle" font-size="10" fill="#555" font-family="Segoe UI">Host platform-lab.local · Calico NP enforced (observed)</text>

  <!-- Data AWS -->
  <rect x="480" y="270" width="400" height="200" rx="8" fill="#ffffff" stroke="#ff9800" stroke-width="2"/>
  <text x="680" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#e65100">DATA PLANE — AWS</text>
  <rect x="500" y="315" width="80" height="28" rx="4" fill="#fce4ec" stroke="#ad1457"/><text x="540" y="333" text-anchor="middle" font-size="10" font-family="Segoe UI">Client</text>
  <text x="600" y="333" font-size="14" fill="#ad1457">?</text>
  <rect x="610" y="315" width="240" height="28" rx="4" fill="#e0f7fa" stroke="#00796b"/><text x="730" y="333" text-anchor="middle" font-size="10" font-family="Segoe UI">ALB ? Pod IP (target-type IP)</text>
  <path d="M680 343 V365" stroke="#ad1457"/>
  <rect x="580" y="365" width="200" height="28" rx="4" fill="#ffe8e8" stroke="#a53b3b"/><text x="680" y="383" text-anchor="middle" font-size="10" font-family="Segoe UI">Service ? Pod :8000</text>
  <text x="680" y="415" text-anchor="middle" font-size="10" fill="#555" font-family="Segoe UI">NetworkPolicy objects exist · enforcement not observed (VPC CNI)</text>

  <text x="460" y="500" text-anchor="middle" font-size="11" fill="#333" font-family="Segoe UI">Terraform and Argo are not HTTP hops on the data path</text>
</svg>

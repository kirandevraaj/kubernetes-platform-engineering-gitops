<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="Automation vs GitOps">
  <title>Automation vs GitOps</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}
      .ops{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:8}
      .git{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:8}
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#0f172a}
      .l{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#0f172a}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:11px;fill:#475569}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:6 4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="390" y="28" text-anchor="middle" class="t">Automation vs GitOps</text>

  <text x="190" y="58" text-anchor="middle" class="l">Operational automation</text>
  <rect x="70" y="72" width="240" height="44" class="ops"/><text x="190" y="99" text-anchor="middle" class="l">Python / Ansible</text>
  <path class="line" d="M190 116 V140"/>
  <rect x="70" y="140" width="240" height="50" class="box"/><text x="190" y="162" text-anchor="middle" class="l">configuration / operations</text><text x="190" y="178" text-anchor="middle" class="s">OS · APIs · automation-lab</text>

  <text x="590" y="58" text-anchor="middle" class="l">GitOps path</text>
  <rect x="470" y="72" width="240" height="44" class="git"/><text x="590" y="99" text-anchor="middle" class="l">Git desired state</text>
  <path class="line" d="M590 116 V140"/>
  <rect x="470" y="140" width="240" height="44" class="git"/><text x="590" y="167" text-anchor="middle" class="l">Argo CD</text>
  <path class="line" d="M590 184 V208"/>
  <rect x="470" y="208" width="240" height="50" class="box"/><text x="590" y="230" text-anchor="middle" class="l">Kubernetes apps</text><text x="590" y="246" text-anchor="middle" class="s">platform-lab · overlays</text>

  <path class="dash" d="M310 162 H430"/>
  <text x="390" y="154" text-anchor="middle" class="s">may commit</text>
  <text x="390" y="168" text-anchor="middle" class="s">lab desired state</text>

  <rect x="70" y="280" width="640" height="70" class="box"/>
  <text x="390" y="308" text-anchor="middle" class="l">Boundary: Jenkins builds/promotes digests — Argo reconciles — no kubectl apply of apps from CI</text>
  <text x="390" y="328" text-anchor="middle" class="s">Image pin 0.1.4 · sha256:1cca2b59… · ADR-006</text>

  <text x="390" y="390" text-anchor="middle" class="s">Project 1 · Section 24</text>

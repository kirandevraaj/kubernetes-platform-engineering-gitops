<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="VMware vs AWS storage abstraction comparison">
  <title>Same PVC abstraction — different backends</title>
  <text x="460" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Same Kubernetes Interface — Different Storage Behavior</text>

  <rect x="40" y="70" width="400" height="160" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="240" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">VMware (local-path lab)</text>
  <text x="240" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod → PVC → PV → local-path</text>
  <text x="240" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">→ node-local hostPath</text>
  <text x="240" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Node-tied · not automatically movable</text>
  <text x="240" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod recreate on same node: data OK</text>

  <rect x="480" y="70" width="400" height="160" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="680" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">AWS (EBS CSI lab)</text>
  <text x="680" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod → PVC → EBS CSI → EBS volume</text>
  <text x="680" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">→ network-attached block device</text>
  <text x="680" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">AZ-scoped · attachable to nodes in AZ</text>
  <text x="680" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Different failure / mobility model</text>
</svg>

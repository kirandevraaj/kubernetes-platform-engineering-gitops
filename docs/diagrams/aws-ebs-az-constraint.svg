<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="EBS AZ constraint">
  <title>EBS volume cannot be mounted from a different Availability Zone</title>
  <text x="460" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">EBS Availability Zone Constraint</text>

  <rect x="60" y="70" width="360" height="280" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="240" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Different AZ — blocked</text>
  <text x="240" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">EBS volume in ap-south-1b</text>
  <text x="240" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b91c1c">X</text>
  <text x="240" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">ap-south-1a worker</text>
  <text x="240" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod stays Pending when</text>
  <text x="240" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">same-AZ workers are cordoned</text>
  <text x="240" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">EBS volume cannot be mounted</text>
  <text x="240" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">from a different Availability Zone</text>

  <rect x="500" y="70" width="360" height="280" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="680" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Same AZ — allowed</text>
  <text x="680" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">EBS volume in ap-south-1b</text>
  <polyline points="667,180 676,190 694,170" fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="680" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">ap-south-1b worker</text>
  <text x="680" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">CSI attaches existing volume</text>
  <text x="680" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod becomes Ready</text>
  <text x="680" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">PV nodeAffinity:</text>
  <text x="680" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">topology.kubernetes.io/zone=ap-south-1b</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-label="AWS storage Pod recovery flow">
  <title>AWS EBS Pod Recovery — same PVC/PV/EBS</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="460" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pod Failure Recovery (same AZ) — AWS EBS Lab</text>

  <rect x="300" y="60" width="320" height="52" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">storage-demo-0</text>
  <text x="460" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Running · /data/state.txt written</text>
  <path d="M460 112 V132" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="132" width="320" height="48" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="460" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">kubectl delete pod</text>
  <text x="460" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">PVC / PV / EBS not deleted</text>
  <path d="M460 180 V200" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="200" width="320" height="52" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="460" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">StatefulSet recreates storage-demo-0</text>
  <text x="460" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Same ordinal · new Pod UID</text>
  <path d="M460 252 V272" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="272" width="320" height="48" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="460" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">same PVC</text>
  <text x="460" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">data-storage-demo-0 remains Bound</text>
  <path d="M460 320 V340" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="340" width="320" height="48" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="460" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">same PV</text>
  <text x="460" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">CSI volumeHandle unchanged</text>
  <path d="M460 388 V408" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="408" width="320" height="48" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="460" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">same EBS volume</text>
  <text x="460" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">CSI reattaches / remounts</text>
  <path d="M460 456 V476" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="476" width="320" height="56" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="460" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">state.txt survives</text>
  <text x="460" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">File contents identical before and after</text>

  <rect x="80" y="560" width="760" height="120" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="100" y="592" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Identity comparison</text>
  <text x="100" y="616" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod name / ordinal: same (storage-demo-0)</text>
  <text x="100" y="636" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod UID: changes · PVC: same · PV: same · EBS volume ID: same</text>
  <text x="100" y="656" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">This proves Pod deletion resilience — not worker-node or AZ failure resilience</text>
</svg>

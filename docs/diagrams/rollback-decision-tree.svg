<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="Rollback decision tree">
  <title>Rollback decision tree</title>
  <rect width="900" height="460" fill="#f7f8fa"/>
  <text x="24" y="36" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a1a">Rollback decision tree</text>
  <text x="24" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">Primary path: Git rollback then Argo reconcile (not kubectl rollout undo)</text>
  <rect x="340" y="80" width="160" height="40" rx="6" fill="#e8f1ff" stroke="#3b6ea5"/>
  <text x="365" y="105" font-family="Arial, Helvetica, sans-serif" font-size="13">Issue detected</text>
  <path d="M420 120 V150" stroke="#333" fill="none"/>
  <rect x="320" y="150" width="200" height="40" rx="6" fill="#fff4e0" stroke="#a57a3b"/>
  <text x="345" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13">Recent deployment?</text>
  <path d="M320 170 H160 V200" stroke="#333" fill="none"/>
  <text x="230" y="162" font-family="Arial, Helvetica, sans-serif" font-size="11">Yes</text>
  <path d="M520 170 H710 V200" stroke="#333" fill="none"/>
  <text x="600" y="162" font-family="Arial, Helvetica, sans-serif" font-size="11">No</text>
  <rect x="60" y="200" width="200" height="40" rx="6" fill="#e8f1ff" stroke="#3b6ea5"/>
  <text x="90" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13">Inspect rollout / RS</text>
  <path d="M160 240 V270" stroke="#333" fill="none"/>
  <rect x="40" y="270" width="240" height="40" rx="6" fill="#fff4e0" stroke="#a57a3b"/>
  <text x="55" y="295" font-family="Arial, Helvetica, sans-serif" font-size="13">Known-good Git commit?</text>
  <path d="M120 310 V360" stroke="#333" fill="none"/>
  <text x="128" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11">yes</text>
  <rect x="30" y="360" width="180" height="48" rx="6" fill="#e8ffe8" stroke="#3ba55a"/>
  <text x="50" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12">Git rollback</text>
  <text x="50" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12">Argo reconcile</text>
  <path d="M280 290 H330 V360" stroke="#333" fill="none"/>
  <text x="338" y="330" font-family="Arial, Helvetica, sans-serif" font-size="11">no</text>
  <rect x="250" y="360" width="160" height="40" rx="6" fill="#ffe8e8" stroke="#a53b3b"/>
  <text x="295" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13">Investigate</text>
  <rect x="600" y="200" width="220" height="56" rx="6" fill="#f0e8ff" stroke="#6b3ba5"/>
  <text x="620" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13">Infrastructure /</text>
  <text x="620" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13">platform triage</text>
</svg>

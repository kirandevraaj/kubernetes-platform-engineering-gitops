<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" role="img" aria-label="Python automation stack">
  <title>Python automation stack</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}
      .py{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:8}
      .ad{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:8}
      .ok{fill:#fefce8;stroke:#a16207;stroke-width:2;rx:8}
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#0f172a}
      .l{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#0f172a}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:11px;fill:#475569}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="260" y="28" text-anchor="middle" class="t">Python Automation Stack</text>
  <rect x="160" y="48" width="200" height="40" class="box"/><text x="260" y="73" text-anchor="middle" class="l">CLI</text>
  <path class="line" d="M260 88 V110"/>
  <rect x="160" y="110" width="200" height="44" class="py"/><text x="260" y="137" text-anchor="middle" class="l">Python controller</text>
  <path class="line" d="M260 154 V176"/>
  <rect x="120" y="176" width="280" height="36" class="box"/><text x="260" y="199" text-anchor="middle" class="l">Adapters</text>
  <path class="line" d="M160 212 V240"/>
  <path class="line" d="M210 212 V240"/>
  <path class="line" d="M260 212 V240"/>
  <path class="line" d="M310 212 V240"/>
  <path class="line" d="M360 212 V240"/>
  <rect x="40" y="240" width="88" height="50" class="ad"/><text x="84" y="270" text-anchor="middle" class="l">REST</text>
  <rect x="138" y="240" width="88" height="50" class="ad"/><text x="182" y="262" text-anchor="middle" class="l">Kubernetes</text><text x="182" y="278" text-anchor="middle" class="s">client 32.0.1</text>
  <rect x="236" y="240" width="88" height="50" class="ad"/><text x="280" y="270" text-anchor="middle" class="l">AWS</text>
  <rect x="334" y="240" width="88" height="50" class="ad"/><text x="378" y="262" text-anchor="middle" class="l">Ansible</text><text x="378" y="278" text-anchor="middle" class="s">Runner</text>
  <rect x="432" y="240" width="72" height="50" class="ad"/><text x="468" y="262" text-anchor="middle" class="l">Terra</text><text x="468" y="278" text-anchor="middle" class="s">form</text>
  <path class="line" d="M84 290 V330"/>
  <path class="line" d="M182 290 V330"/>
  <path class="line" d="M280 290 V330"/>
  <path class="line" d="M378 290 V330"/>
  <path class="line" d="M468 290 V330"/>
  <path class="line" d="M84 330 H468"/>
  <path class="line" d="M260 330 V360"/>
  <rect x="140" y="360" width="240" height="50" class="ok"/><text x="260" y="382" text-anchor="middle" class="l">Verification</text><text x="260" y="398" text-anchor="middle" class="s">PASS · FAIL · UNKNOWN</text>
  <path class="line" d="M260 410 V440"/>
  <rect x="140" y="440" width="240" height="44" class="box"/><text x="260" y="467" text-anchor="middle" class="l">Report + exit code</text>
  <text x="260" y="520" text-anchor="middle" class="s">Safe mutate: automation-lab only</text>
  <text x="260" y="540" text-anchor="middle" class="s">Not a replacement for Argo CD or Jenkins CI</text>
  <text x="260" y="580" text-anchor="middle" class="s">Project 1 · Section 24</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="VMware vs AWS storage comparison">
  <title>Kubernetes abstraction shared — storage backend different</title>

  <text x="480" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Project 1 Storage — VMware vs AWS</text>

  <rect x="40" y="56" width="880" height="44" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="480" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#047857">Kubernetes abstraction is shared: Pod → PVC → PV</text>

  <rect x="40" y="120" width="420" height="160" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="250" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">VMware / kubeadm</text>
  <text x="250" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">PVC → local-path → node-local disk</text>
  <text x="250" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">rancher.io/local-path · hostPath</text>
  <text x="250" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">PV nodeAffinity to worker hostname</text>
  <text x="250" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod recreate on same node: data OK</text>

  <rect x="500" y="120" width="420" height="160" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="710" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">AWS / EKS</text>
  <text x="710" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">PVC → EBS CSI → EBS volume</text>
  <text x="710" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">ebs.csi.aws.com · gp3 · AZ-scoped</text>
  <text x="710" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">WaitForFirstConsumer + topology</text>
  <text x="710" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod recreate: CSI reattaches EBS</text>

  <rect x="40" y="300" width="880" height="40" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="480" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Storage backend is different — do not claim equal resilience</text>
</svg>

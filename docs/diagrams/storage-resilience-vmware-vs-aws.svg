<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Storage resilience VMware vs AWS">
  <title>VMware local-path vs AWS EBS resilience</title>
  <text x="490" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Storage Resilience — VMware local-path vs AWS EBS</text>

  <rect x="40" y="60" width="430" height="360" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="255" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">VMware</text>
  <text x="255" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod → PVC → PV → local-path</text>
  <text x="255" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">→ worker-local filesystem</text>
  <text x="255" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Worker failure</text>
  <text x="255" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">storage remains on failed worker</text>
  <text x="255" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod cannot simply remount elsewhere</text>
  <text x="255" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Scope: node-local</text>
  <text x="255" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod delete on same node: data OK</text>
  <text x="255" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Node loss: data mobility not automatic</text>
  <text x="255" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Proven: Pod recreation only</text>

  <rect x="510" y="60" width="430" height="360" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="725" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">AWS</text>
  <text x="725" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod → PVC → PV → EBS CSI → EBS</text>
  <text x="725" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">→ AZ-scoped block volume</text>
  <text x="725" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Worker failure</text>
  <text x="725" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">another worker SAME AZ</text>
  <text x="725" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">EBS reattach → Pod recovers</text>
  <text x="725" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Scope: AZ-local (not multi-AZ)</text>
  <text x="725" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Pod delete: data OK (proven)</text>
  <text x="725" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Same-AZ node loss: recover (proven)</text>
  <text x="725" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Cross-AZ: blocked by topology</text>

  <rect x="40" y="440" width="900" height="55" fill="#fff7ed" stroke="#c2410c" stroke-width="2" rx="8"/>
  <text x="490" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Both are NOT multi-AZ storage.</text>
</svg>

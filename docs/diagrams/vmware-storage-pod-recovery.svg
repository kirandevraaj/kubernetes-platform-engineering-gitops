<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Pod failure recovery with PVC persistence">
  <title>Pod failure recovery  same PVC/PV</title>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:8; }
      .ok { fill:#ecfdf5; stroke:#047857; stroke-width:2; rx:8; }
      .del { fill:#fef2f2; stroke:#b91c1c; stroke-width:2; rx:8; }
      .title { font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:18px; font-weight:700; fill:#0f172a; }
      .label { font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:13px; font-weight:600; fill:#0f172a; }
      .sub { font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:11px; fill:#475569; }
      .line { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#a2); }
    </style>
  </defs>
  <text x="460" y="32" text-anchor="middle" class="title">Pod Failure Recovery  PVC/PV Survive</text>

  <rect x="40" y="70" width="160" height="56" class="box"/>
  <text x="120" y="94" text-anchor="middle" class="label">Pod-0</text>
  <text x="120" y="112" text-anchor="middle" class="sub">storage-demo-0</text>

  <path class="line" d="M200 98 H250"/>
  <rect x="250" y="70" width="140" height="56" class="box"/>
  <text x="320" y="94" text-anchor="middle" class="label">PVC</text>
  <text x="320" y="112" text-anchor="middle" class="sub">data-storage-demo-0</text>

  <path class="line" d="M390 98 H440"/>
  <rect x="440" y="70" width="140" height="56" class="box"/>
  <text x="510" y="94" text-anchor="middle" class="label">PV</text>
  <text x="510" y="112" text-anchor="middle" class="sub">local-path volume</text>

  <path class="line" d="M580 98 H630"/>
  <rect x="630" y="70" width="250" height="56" class="ok"/>
  <text x="755" y="94" text-anchor="middle" class="label">/data/state.txt</text>
  <text x="755" y="112" text-anchor="middle" class="sub">persistent file on PVC</text>

  <path class="line" d="M120 126 V170"/>
  <rect x="40" y="170" width="160" height="48" class="del"/>
  <text x="120" y="200" text-anchor="middle" class="label">Pod deleted</text>

  <path class="line" d="M120 218 V250"/>
  <rect x="40" y="250" width="160" height="48" class="box"/>
  <text x="120" y="280" text-anchor="middle" class="label">StatefulSet</text>

  <path class="line" d="M120 298 V330"/>
  <rect x="40" y="330" width="160" height="56" class="ok"/>
  <text x="120" y="354" text-anchor="middle" class="label">Pod-0 recreated</text>
  <text x="120" y="372" text-anchor="middle" class="sub">same identity</text>

  <path class="line" d="M200 358 H250"/>
  <rect x="250" y="330" width="340" height="56" class="ok"/>
  <text x="420" y="354" text-anchor="middle" class="label">mounts same PVC ’ same PV</text>
  <text x="420" y="372" text-anchor="middle" class="sub">state.txt survives · not emptyDir / ConfigMap</text>

  <path class="line" d="M590 358 H630"/>
  <rect x="630" y="330" width="250" height="56" class="ok"/>
  <text x="755" y="354" text-anchor="middle" class="label">state.txt survives</text>
  <text x="755" y="372" text-anchor="middle" class="sub">contents unchanged</text>
</svg>

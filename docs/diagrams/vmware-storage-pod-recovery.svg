<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Pod failure recovery with PVC persistence">
  <title>Pod failure recovery — same PVC/PV</title>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="460" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Pod Failure Recovery — PVC/PV Survive</text>

  <rect x="40" y="70" width="160" height="56" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="120" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Pod-0</text>
  <text x="120" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">storage-demo-0</text>

  <path d="M200 98 H250" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="250" y="70" width="140" height="56" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="320" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">PVC</text>
  <text x="320" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">data-storage-demo-0</text>

  <path d="M390 98 H440" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="440" y="70" width="140" height="56" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="510" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">PV</text>
  <text x="510" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">local-path volume</text>

  <path d="M580 98 H630" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="630" y="70" width="250" height="56" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="755" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">/data/state.txt</text>
  <text x="755" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">persistent file on PVC</text>

  <path d="M120 126 V170" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="40" y="170" width="160" height="48" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="120" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Pod deleted</text>

  <path d="M120 218 V250" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="40" y="250" width="160" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="120" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">StatefulSet</text>

  <path d="M120 298 V330" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="40" y="330" width="160" height="56" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="120" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Pod-0 recreated</text>
  <text x="120" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">same identity</text>

  <path d="M200 358 H250" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="250" y="330" width="340" height="56" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="420" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">mounts same PVC → same PV</text>
  <text x="420" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">state.txt survives · not emptyDir / ConfigMap</text>

  <path d="M590 358 H630" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <rect x="630" y="330" width="250" height="56" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="755" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">state.txt survives</text>
  <text x="755" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">contents unchanged</text>

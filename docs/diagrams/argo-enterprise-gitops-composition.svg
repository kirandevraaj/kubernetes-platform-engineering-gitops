<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="Enterprise GitOps composition">
  <title>Enterprise GitOps composition</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:8}
      .ci{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:8}
      .cd{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:8}
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;fill:#0f172a}
      .l{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;fill:#0f172a}
      .s{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:11px;fill:#475569}
      .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="450" y="28" text-anchor="middle" class="t">Project 1 Enterprise GitOps Composition</text>
  <rect x="360" y="48" width="180" height="36" class="box"/><text x="450" y="70" text-anchor="middle" class="l">Developer</text>
  <path class="line" d="M450 84 V110"/>
  <rect x="360" y="110" width="180" height="36" class="box"/><text x="450" y="132" text-anchor="middle" class="l">GitHub</text>
  <path class="line" d="M450 146 V170"/>
  <path class="line" d="M250 200 V170 H650 V200"/>
  <rect x="120" y="200" width="220" height="70" class="ci"/>
  <text x="230" y="228" text-anchor="middle" class="l">Jenkins CI</text>
  <text x="230" y="248" text-anchor="middle" class="s">build / test / publish / promote</text>
  <rect x="560" y="200" width="220" height="70" class="cd"/>
  <text x="670" y="228" text-anchor="middle" class="l">Argo CD</text>
  <text x="670" y="248" text-anchor="middle" class="s">reconcile desired state</text>
  <path class="line" d="M230 270 V300"/>
  <rect x="140" y="300" width="180" height="36" class="box"/><text x="230" y="322" text-anchor="middle" class="l">Docker Hub</text>
  <path class="line" d="M670 270 V300"/>
  <rect x="560" y="300" width="220" height="40" class="box"/><text x="670" y="324" text-anchor="middle" class="l">AppProject boundary</text>
  <path class="line" d="M670 340 V370"/>
  <path class="line" d="M520 400 V370 H820 V400"/>
  <rect x="420" y="400" width="180" height="50" class="cd"/>
  <text x="510" y="422" text-anchor="middle" class="l">ApplicationSet</text>
  <text x="510" y="438" text-anchor="middle" class="s">generate Apps</text>
  <rect x="640" y="400" width="180" height="50" class="cd"/>
  <text x="730" y="422" text-anchor="middle" class="l">App-of-Apps</text>
  <text x="730" y="438" text-anchor="middle" class="s">compose Apps</text>
  <path class="line" d="M510 450 V480"/>
  <path class="line" d="M730 450 V480"/>
  <path class="line" d="M510 480 H730"/>
  <path class="line" d="M620 480 V500"/>
  <rect x="500" y="500" width="240" height="36" class="box"/><text x="620" y="522" text-anchor="middle" class="l">Sync: hooks · waves · options</text>
  <path class="line" d="M620 536 V560"/>
  <rect x="420" y="560" width="400" height="50" class="box"/>
  <text x="620" y="582" text-anchor="middle" class="l">Kubernetes · VMware · AWS · Observability</text>
  <text x="620" y="600" text-anchor="middle" class="s">Git remains authoritative desired state</text>
</svg>

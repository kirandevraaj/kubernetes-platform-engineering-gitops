<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="780" viewBox="0 0 980 780" role="img" aria-label="AWS EBS node failure recovery">
  <title>AWS EBS same-AZ worker failure recovery</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <text x="490" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AWS EKS — EBS Node Failure Recovery (same AZ)</text>

  <rect x="370" y="48" width="240" height="36" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="490" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">AWS EKS</text>
  <path d="M490 84 V100" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="370" y="100" width="240" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="490" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">StatefulSet storage-demo</text>
  <path d="M490 140 V156" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="370" y="156" width="240" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="490" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">storage-demo-0 → PVC → PV</text>
  <path d="M490 196 V212" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="340" y="212" width="300" height="44" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="490" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">EBS CSI Driver</text>
  <text x="490" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">ebs.csi.aws.com · Pod Identity</text>
  <path d="M490 256 V272" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="340" y="272" width="300" height="48" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="490" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">same EBS volume vol-05faa26874d720ecd</text>
  <text x="490" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">AZ ap-south-1b · CSI-owned lifecycle</text>
  <path d="M490 320 V336" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="370" y="336" width="240" height="40" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="490" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Availability Zone ap-south-1b</text>

  <path d="M370 356 H220 V378" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 356 H760 V378" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="80" y="380" width="280" height="120" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="220" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Failed Worker</text>
  <text x="220" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">ip-10-50-52-64 · i-0cd6b629a5f2a70a8</text>
  <text x="220" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">EC2 terminate-instances</text>
  <text x="220" y="476" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Pod disappears with node</text>

  <rect x="620" y="380" width="280" height="120" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="760" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Replacement Worker</text>
  <text x="760" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">ip-10-50-59-108 · same AZ</text>
  <text x="760" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Pod recreated · EBS reattach</text>
  <text x="760" y="476" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Mount /data · state.txt survives</text>

  <rect x="120" y="540" width="740" height="100" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="8"/>
  <text x="490" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Same PVC · same PV · same EBS volume · same Availability Zone</text>
  <text x="490" y="596" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">FailedAttachVolume wait for detach (~6 min) then SuccessfulAttachVolume via CSI</text>
  <text x="490" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">T0 terminate → T6 Ready ≈ 379s · data identical · NOT multi-AZ storage</text>

  <rect x="120" y="660" width="740" height="80" fill="#f8fafc" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="490" y="692" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Temporary same-AZ capacity (storage-resilience-test-1b) was required</text>
  <text x="490" y="716" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Only one worker existed in ap-south-1b before the test · temp NG destroyed after recovery</text>
</svg>

# Disposable snapshot restore lab — NOT the original storage-demo.
# Restores from VolumeSnapshot storage-demo-snapshot into a NEW PVC/volume.
apiVersion: v1
kind: Namespace
metadata:
  name: dr-storage-restore
  labels:
    app.kubernetes.io/name: dr-storage-restore
    platform-lab.io/purpose: disaster-recovery-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restored-storage
  namespace: dr-storage-restore
  labels:
    app.kubernetes.io/name: storage-restore-demo
    platform-lab.io/purpose: disaster-recovery-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-gp3
  resources:
    requests:
      storage: 1Gi
  dataSource:
    name: storage-demo-snapshot
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: storage-restore-demo
  namespace: dr-storage-restore
  labels:
    app.kubernetes.io/name: storage-restore-demo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: storage-restore-demo
  ports:
    - port: 80
      name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-restore-demo
  namespace: dr-storage-restore
  labels:
    app.kubernetes.io/name: storage-restore-demo
    platform-lab.io/purpose: disaster-recovery-lab
spec:
  serviceName: storage-restore-demo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-restore-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-restore-demo
        platform-lab.io/purpose: disaster-recovery-lab
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "echo 'restore-demo ready'; sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: restored-storage

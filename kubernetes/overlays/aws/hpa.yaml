apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-lab
  labels:
    app.kubernetes.io/name: platform-lab
    app.kubernetes.io/instance: platform-lab
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: platform-lab
    platform-lab.io/target: aws
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-lab
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

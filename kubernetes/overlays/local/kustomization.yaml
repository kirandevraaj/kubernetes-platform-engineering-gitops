apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress-nginx-controller-service.yaml
  - servicemonitor.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: kirandevraaj/platform-lab
    digest: sha256:945424e996f474c4cac45dd18c8c38319394a790ae00a2cd68c5ce9059461b96
# Version label = logical release; digest = immutable artifact (Jenkins updates both).
labels:
  - pairs:
      app.kubernetes.io/version: "0.1.5"
    includeSelectors: false
    includeTemplates: true
patches:
  - path: networkpolicy-prometheus-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: platform-lab
  - path: deployment-reliability-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: platform-lab

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress-nginx-controller-service.yaml
  - servicemonitor.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: kirandevraaj/platform-lab
    digest: sha256:1cca2b5964043fe6c9c09f17d7f86a3572a46699602919d15c45c9a069b872ff
# Version label = logical release; digest = immutable artifact (Jenkins updates both).
labels:
  - pairs:
      app.kubernetes.io/version: "0.1.4"
    includeSelectors: false
    includeTemplates: true
patches:
  - path: networkpolicy-prometheus-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: platform-lab
  - path: deployment-reliability-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: platform-lab

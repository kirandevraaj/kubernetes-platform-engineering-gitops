apiVersion: v1
kind: ConfigMap
metadata:
  name: env-info
  labels:
    app.kubernetes.io/name: env-info
data:
  environment: "dev"
  message: "Generator target: dev"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-env-demo
  labels:
    app.kubernetes.io/name: advanced-env-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: advanced-env-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: advanced-env-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo env=dev; sleep 3600"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["true"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

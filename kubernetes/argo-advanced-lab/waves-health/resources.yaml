# Health-gated waves demo resources.
# Wave 0 dependency Deployment must become Healthy before wave 1 proceeds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-health-gate-config
  namespace: argo-advanced-lab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: argo-health-gate
    app.kubernetes.io/part-of: argo-advanced-lab
data:
  status: "dependency-ready"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-wave-dependency
  namespace: argo-advanced-lab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: argo-wave-dependency
    app.kubernetes.io/part-of: argo-advanced-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-wave-dependency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-wave-dependency
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ready
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo dependency-ready; sleep 3600"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-wave-dependent
  namespace: argo-advanced-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: argo-wave-dependent
    app.kubernetes.io/part-of: argo-advanced-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-wave-dependent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-wave-dependent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo dependent-started; sleep 3600"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

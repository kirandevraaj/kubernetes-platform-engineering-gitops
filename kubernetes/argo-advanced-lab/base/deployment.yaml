apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-order-demo
  labels:
    app.kubernetes.io/name: argo-order-demo
    app.kubernetes.io/part-of: argo-advanced-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-order-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-order-demo
        app.kubernetes.io/part-of: argo-advanced-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEMO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: argo-demo-config
                  key: demo.message
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}

apiVersion: batch/v1
kind: Job
metadata:
  name: argo-pre-sync-check
  namespace: argo-advanced-lab
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
  labels:
    app.kubernetes.io/name: argo-pre-sync-check
    app.kubernetes.io/part-of: argo-advanced-lab
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-pre-sync-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "PreSync: validating argo-advanced-lab namespace context"
              echo "PreSync: harmless check complete"
              exit 0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argo-post-sync-check
  namespace: argo-advanced-lab
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: argo-post-sync-check
    app.kubernetes.io/part-of: argo-advanced-lab
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-post-sync-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: public.ecr.aws/docker/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "PostSync: verifying normal sync completed"
              echo "PostSync: harmless verification complete"
              exit 0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

# Hardened demo Pod using security-reader (API token mounted by default).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-reader-demo
  namespace: security-lab
  labels:
    app.kubernetes.io/name: security-reader-demo
    app.kubernetes.io/part-of: security-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: security-reader-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-reader-demo
        app.kubernetes.io/part-of: security-lab
        security-lab.io/role: reader-demo
    spec:
      serviceAccountName: security-reader
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep infinity"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---

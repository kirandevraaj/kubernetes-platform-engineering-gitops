# NetworkPolicy target (ClusterIP only; no external exposure).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-net-server
  namespace: security-lab
  labels:
    app.kubernetes.io/name: security-net-server
    app.kubernetes.io/part-of: security-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: security-net-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-net-server
        app.kubernetes.io/part-of: security-lab
        security-lab.io/role: net-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - while true; do printf 'HTTP/1.0 200 OK\r\nContent-Length: 2\r\n\r\nOK' | nc -l -p 8080; done
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: security-net-server
  namespace: security-lab
  labels:
    app.kubernetes.io/name: security-net-server
    app.kubernetes.io/part-of: security-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: security-net-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---

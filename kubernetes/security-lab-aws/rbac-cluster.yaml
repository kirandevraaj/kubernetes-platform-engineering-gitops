apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-node-reader
  labels:
    app.kubernetes.io/part-of: security-lab
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-pod-viewer
  labels:
    app.kubernetes.io/part-of: security-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: security-global-pod-reader-role
  labels:
    app.kubernetes.io/part-of: security-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-node-reader-binding
  labels:
    app.kubernetes.io/part-of: security-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: security-node-reader
subjects:
  - kind: ServiceAccount
    name: security-node-reader
    namespace: security-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: security-global-reader-binding
  labels:
    app.kubernetes.io/part-of: security-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: security-global-pod-reader-role
subjects:
  - kind: ServiceAccount
    name: security-global-reader
    namespace: security-lab

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-recovery-demo
  namespace: dr-lab
  labels:
    app.kubernetes.io/name: dr-recovery-demo
    app.kubernetes.io/part-of: platform-lab
    platform-lab.io/purpose: disaster-recovery-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dr-recovery-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dr-recovery-demo
        platform-lab.io/purpose: disaster-recovery-lab
    spec:
      containers:
        - name: demo
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: DR_MARKER_VERSION
              valueFrom:
                configMapKeyRef:
                  name: dr-recovery-marker
                  key: version
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-lab
  namespace: argocd
  labels:
    app.kubernetes.io/name: platform-lab
    app.kubernetes.io/part-of: platform-lab
spec:
  description: Platform-lab applications for the local VMware Kubernetes lab
  sourceRepos:
    - https://github.com/kirandevraaj/kubernetes-platform-engineering-gitops.git
  destinations:
    - namespace: platform-lab
      server: https://kubernetes.default.svc
    # Local lab only: allow GitOps to patch the existing ingress-nginx controller Service
    # to type LoadBalancer (MetalLB). AWS overlay does not include this resource.
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    # Local-overlay ServiceMonitor for Prometheus Operator scrapes.
    - group: monitoring.coreos.com
      kind: ServiceMonitor
  orphanedResources:
    warn: true

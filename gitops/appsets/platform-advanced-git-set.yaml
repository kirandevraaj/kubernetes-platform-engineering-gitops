# Git generator ApplicationSet — generates Applications from directory discovery.
# Uses distinct Application names (git-advanced-*) from the list generator
# (argo-advanced-*). Final steady state applies ONLY the list ApplicationSet for
# env workloads; this set is applied during the Git-generator experiment, then
# removed so two Applications do not compete for the same resources.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-advanced-git-set
  namespace: argocd
  labels:
    app.kubernetes.io/name: platform-advanced-git-set
    platform-lab.io/lab: argo-advanced
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/kirandevraaj/kubernetes-platform-engineering-gitops.git
        revision: main
        directories:
          - path: kubernetes/argo-advanced-apps/*
  template:
    metadata:
      name: 'git-advanced-{{.path.basename}}'
      labels:
        platform-lab.io/lab: argo-advanced
        platform-lab.io/env: '{{.path.basename}}'
        platform-lab.io/generator: git
    spec:
      project: platform-advanced-lab
      source:
        repoURL: https://github.com/kirandevraaj/kubernetes-platform-engineering-gitops.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'argo-advanced-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-security-aws
  namespace: argocd
  labels:
    app.kubernetes.io/name: platform-security-aws
    app.kubernetes.io/part-of: platform-lab
    platform-lab.io/target: aws
spec:
  project: platform-security-aws
  source:
    repoURL: https://github.com/kirandevraaj/kubernetes-platform-engineering-gitops.git
    targetRevision: main
    path: kubernetes/security-lab-aws
  destination:
    # In-cluster API of the AWS EKS Argo CD instance. Never apply onto VMware ckad-lab.
    server: https://kubernetes.default.svc
    namespace: security-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

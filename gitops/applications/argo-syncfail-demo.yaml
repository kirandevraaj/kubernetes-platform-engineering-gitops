apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-syncfail-demo
  namespace: argocd
  labels:
    platform-lab.io/lab: argo-advanced
spec:
  project: platform-advanced-lab
  source:
    repoURL: https://github.com/kirandevraaj/kubernetes-platform-engineering-gitops.git
    targetRevision: main
    path: kubernetes/argo-advanced-lab/syncfail-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-advanced-lab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

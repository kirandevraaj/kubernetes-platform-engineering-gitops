apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-lab-observability
  namespace: argocd
  labels:
    app.kubernetes.io/name: platform-lab-observability
    app.kubernetes.io/instance: platform-lab-observability
    app.kubernetes.io/part-of: platform-lab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-lab-observability
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.5.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/observability/values-kube-prometheus-stack.yaml
    - repoURL: https://github.com/kirandevraaj/kubernetes-platform-engineering-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/kirandevraaj/kubernetes-platform-engineering-gitops.git
      targetRevision: main
      path: observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      jsonPointers:
        - /data

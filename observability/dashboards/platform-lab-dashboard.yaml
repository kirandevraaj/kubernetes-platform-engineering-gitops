apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-lab-grafana-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/name: platform-lab
    app.kubernetes.io/part-of: platform-lab
    grafana_dashboard: "1"
data:
  platform-lab.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"platform-lab\", job=~\".*platform-lab.*\"}[5m])) or sum(rate(http_requests_total{namespace=\"platform-lab\"}[5m]))",
              "legendFormat": "req/s",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Request error rate (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"platform-lab\", status=~\"5..\"}[5m])) or vector(0)",
              "legendFormat": "5xx/s",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP response status",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"platform-lab\"}[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Request latency (p50 / p95)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"platform-lab\"}[5m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"platform-lab\"}[5m])))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ]
        },
        {
          "title": "Pod availability",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"platform-lab\", deployment=\"platform-lab\"}",
              "legendFormat": "available",
              "refId": "A"
            },
            {
              "expr": "kube_deployment_status_replicas_unavailable{namespace=\"platform-lab\", deployment=\"platform-lab\"}",
              "legendFormat": "unavailable",
              "refId": "B"
            }
          ]
        },
        {
          "title": "Replica count",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "kube_deployment_spec_replicas{namespace=\"platform-lab\", deployment=\"platform-lab\"}",
              "legendFormat": "desired",
              "refId": "A"
            },
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"platform-lab\", deployment=\"platform-lab\"}",
              "legendFormat": "ready",
              "refId": "B"
            }
          ]
        },
        {
          "title": "CPU usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"platform-lab\", container=\"platform-lab\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Memory usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"platform-lab\", container=\"platform-lab\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["platform-lab", "observability"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "platform-lab",
      "uid": "platform-lab",
      "version": 1
    }

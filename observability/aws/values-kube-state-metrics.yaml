# kube-state-metrics — AWS EKS (standalone chart; not kube-prometheus-stack).
# Single replica. ClusterIP only. Focused collectors for this lab.
# Does NOT replace Metrics Server (HPA still uses Metrics Server).

replicas: 1

autosharding:
  enabled: false

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Chart defaults already harden the pod; keep them explicit for review.
securityContext:
  enabled: true
  runAsGroup: 65534
  runAsUser: 65534
  fsGroup: 65534
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

rbac:
  create: true
  useClusterRole: true

# Focused collectors only — Kubernetes object state useful for this project.
# Intentionally excludes secrets, webhooks, leases, volumeattachments, etc.
collectors:
  - nodes
  - pods
  - deployments
  - replicasets
  - services
  - endpointslices
  - horizontalpodautoscalers
  - statefulsets
  # Storage lab observability (platform-storage-aws / ebs-gp3).
  - persistentvolumeclaims
  - persistentvolumes

prometheus:
  monitor:
    enabled: false

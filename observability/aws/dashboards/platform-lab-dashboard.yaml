apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-lab-aws-grafana-dashboard
  namespace: observability
  labels:
    app.kubernetes.io/name: platform-lab
    app.kubernetes.io/part-of: platform-lab
    platform-lab.io/target: aws
    grafana_dashboard: "1"
data:
  platform-lab-aws.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Target up (platform-lab)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [
            { "expr": "min(up{job=\"platform-lab\"})", "legendFormat": "up", "refId": "A" }
          ]
        },
        {
          "title": "Prometheus self up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "none" },
          "targets": [
            { "expr": "up{job=\"prometheus\"}", "legendFormat": "prometheus", "refId": "A" }
          ]
        },
        {
          "title": "HTTP request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"platform-lab\"}[5m]))",
              "legendFormat": "req/s",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP requests by handler",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            }
          },
          "targets": [
            {
              "expr": "sum by (handler) (rate(http_requests_total{job=\"platform-lab\"}[5m]))",
              "legendFormat": "{{handler}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Process resident memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            }
          },
          "targets": [
            {
              "expr": "process_resident_memory_bytes{job=\"platform-lab\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Process CPU seconds (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "drawStyle": "line", "fillOpacity": 10, "spanNulls": true }
            }
          },
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{job=\"platform-lab\"}[5m])",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["platform-lab", "aws", "lightweight"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "platform-lab AWS (lightweight)",
      "uid": "platform-lab-aws-lightweight",
      "version": 1
    }

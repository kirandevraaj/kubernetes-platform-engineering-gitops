---
# Static inventory for Section 24 Ansible lab.
# Prefer localhost for mutations. VMware workers are read-only (ping/setup).
#
# Static AWS public IP lists are fragile: instances change addresses across
# stop/start and ASG replacements. Use inventory/aws_ec2.yml (amazon.aws.aws_ec2)
# keyed by tags instead of hardcoding IPs.

all:
  children:
    lab:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: auto_silent
      vars:
        lab_safe_target: true

    # Optional VMware workers — read-only ping/setup only. Do not mutate.
    # Uncomment and set reachable host-only addresses when practising remote facts.
    vmware_workers:
      hosts:
        # k8s-worker-01:
        #   ansible_host: 192.168.56.11
        #   ansible_user: ubuntu
        #   ansible_become: false
        # k8s-worker-02:
        #   ansible_host: 192.168.56.12
        #   ansible_user: ubuntu
        #   ansible_become: false
      vars:
        lab_readonly: true
        # Safety: playbooks targeting this group must not install packages,
        # rewrite configs, or restart services on cluster nodes.

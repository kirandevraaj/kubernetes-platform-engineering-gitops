# Lab ansible.cfg — Section 24 learning tree
# Run from this directory (automation/ansible) so relative paths resolve.

[defaults]
inventory = inventory
roles_path = roles
collections_paths = collections:~/.ansible/collections
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
# Prefer explicit FQCNs in playbooks; deprecation warnings stay visible for learning.
interpreter_python = auto_silent
gathering = smart
timeout = 30

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, amazon.aws.aws_ec2

[privilege_escalation]
# Lab playbooks default to no become; enable only when a Linux worker task needs it.
become = False
